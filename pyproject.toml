[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relayvsr-studio"
version = "0.2.1"
description = "Windows desktop video upscaler built on RelayVSR (Wan keyframes + Flash decoder), tuned for RTX 50 series"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/LICENSE.RelayVSR"]
authors = [{ name = "RelayVSR Studio contributors" }]
keywords = ["video", "super-resolution", "upscaling", "relayvsr", "wan", "cuda", "windows"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Multimedia :: Video",
]
# The GUI launcher only needs these. The inference engine's heavy dependencies
# (torch, triton, diffusers, av ...) are installed into a managed environment at
# first run; see requirements/engine.txt.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]
engine = [
  "torch>=2.10,<2.11",
  "diffusers==0.37.1",
  "accelerate>=1.0,<2",
  "einops>=0.8",
  "av>=17,<19",
  "safetensors>=0.6",
  "numpy>=1.26",
  "pillow>=10",
  "huggingface_hub>=0.30",
  "nvidia-ml-py>=12",
  "psutil>=5.9",
  "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
  "triton>=3.6,<3.7; sys_platform == 'linux'",
]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.scripts]
relayvsr-studio-cli = "relayvsr_studio.cli:main"

[project.gui-scripts]
relayvsr-studio = "relayvsr_studio.app.main:main"

[project.urls]
Homepage = "https://github.com/yunhyok/relayvsr-studio"
"RelayVSR paper" = "https://arxiv.org/abs/2609.37850"
"RelayVSR project page" = "https://kopperx.github.io/RelayVSR/"

[tool.setuptools.packages.find]
include = ["relayvsr_studio*"]

[tool.setuptools.package-data]
relayvsr_studio = ["app/resources/*", "bootstrap/*.txt"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU (and Triton for kernel equivalence tests)"]
