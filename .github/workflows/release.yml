name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build GUI bundle and installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/build.ps1 -WorkDir "$env:RUNNER_TEMP\rvs-build" -Python python
          Copy-Item "$env:RUNNER_TEMP\rvs-build\installer\*.exe" -Destination . -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: RelayVSR-Studio-Setup-*.exe

      # Releases are published manually (gh release create) after the installer has been
      # exercised on real hardware; attach the CI artifact only if it is missing.
      - name: Attach to release if missing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "no release for $tag; skipping"; exit 0 }
          $file = Get-ChildItem RelayVSR-Studio-Setup-*.exe | Select-Object -First 1
          if ($assets -contains $file.Name) { Write-Host "asset already attached"; exit 0 }
          gh release upload $tag $file.FullName

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU-only unit tests
        run: |
          pip install pytest numpy pillow "av>=17,<19" torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install einops safetensors accelerate "diffusers==0.37.1"
          pytest -q tests -k "not gpu"
